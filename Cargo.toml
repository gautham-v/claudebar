[package]
name = "claudebar"
version = "0.2.0"
edition = "2021"
description = "A macOS menu bar app that shows your Claude usage limits"
license = "MIT"
repository = "https://github.com/gautham-v/claudebar"

[dependencies]
gpui = "0.2.2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
block2 = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

objc2 = "0.6"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "std", "objc2", "objc2-foundation"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGColor", "CGColorSpace", "CGContext", "CGPath"]

[dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSString",
    "NSGeometry",
    "NSDate",
    "NSArray",
    "NSEnumerator",
    "NSObjCRuntime",
    "NSValue",
    "NSError",
    "NSURL",
    "NSNotification",
    "NSRunLoop",
    "NSThread",
    "NSBundle",
    "NSAttributedString",
    "NSDictionary",
]

[dependencies.objc2-app-kit]
version = "0.3"
features = [
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSControl",
    "NSButton",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSImage",
    "NSScreen",
    "NSEvent",
    "NSPanel",
    "NSRunningApplication",
    "NSGraphicsContext",
    "NSCell",
    "NSFont",
    "NSColor",
    "NSAttributedString",
    "NSStringDrawing",
    "NSAppearance",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
]

[profile.release]
opt-level = 2

[lib]
name = "claudebar"
path = "src/lib.rs"

[[bin]]
name = "claudebar"
path = "src/main.rs"
